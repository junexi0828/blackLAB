name: FocusGuard

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: com.juns.beyondcave
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 폐관수련
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  FocusGuard:
    type: application
    platform: iOS
    sources:
      - path: FocusGuard/FocusGuardApp.swift
      - path: FocusGuard/CaveHomeView.swift
      - path: FocusGuard/CaveTheme.swift
      - path: FocusGuard/FocusStudyActivity.swift
      - path: FocusGuard/SharedCaveStore.swift
      - path: FocusGuard/StudySessionStore.swift
      - path: FocusGuard/FocusGuardManager.swift
      - path: FocusGuard/FocusGuardDebugView.swift
      - path: FocusGuard/CaveHistoryView.swift
      - path: FocusGuard/CaveSettingsView.swift
      - path: FocusGuard/CaveMainView.swift
      - path: FocusGuard/CaveSoundManager.swift
      - path: FocusGuard/Assets.xcassets
    entitlements:
      path: FocusGuard/FocusGuard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.juns.beyondcave
    dependencies:
      - target: CaveWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: 폐관수련
        PRODUCT_BUNDLE_IDENTIFIER: com.juns.beyondcave
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    scheme:
      gatherCoverageData: false
      testTargets:
        - FocusGuardUITests

  CaveWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CaveWidgetExtension/CaveWidgetExtension.swift
      - path: CaveWidgetExtension/Assets.xcassets
      - path: FocusGuard/CaveTheme.swift
      - path: FocusGuard/FocusStudyActivity.swift
      - path: FocusGuard/SharedCaveStore.swift
    info:
      path: CaveWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: 폐관위젯
        CFBundleShortVersionString: 1.0.0
        NSSupportsLiveActivities: YES
        NSSupportsLiveActivitiesFrequentUpdates: YES
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.juns.beyondcave
    entitlements:
      path: CaveWidgetExtension/CaveWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.juns.beyondcave
    settings:
      base:
        PRODUCT_NAME: CaveWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.juns.beyondcave.widget
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES

  FocusGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FocusGuardUITests
    dependencies:
      - target: FocusGuard
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
